<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Edit your shop details in the <script> below (search for "COMPANY DATA"). */
  :root{
    --cream:#FBF7EC; --cream-2:#F3EBD6; --green:#0E5A43; --green-deep:#0A3F2F;
    --gold:#B8860B; --saffron:#E39A16; --line:rgba(14,90,67,.18); --radius:6px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ min-height:100%; overflow-x:hidden; }
  body{
    margin:0; background:var(--cream); color:var(--green-deep);
    font-family:'Inter','Tajawal','Noto Sans Devanagari',sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.6;
    display:flex; justify-content:center; min-height:100dvh;
    padding:28px calc(16px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
  }
  :lang(ar) *{ letter-spacing:0 !important; }
  .stage{ width:100%; max-width:640px; display:flex; flex-direction:column; gap:24px; }

  .hero{ position:relative; min-height:clamp(150px,34vw,210px); border-radius:10px; overflow:hidden; box-shadow:0 18px 36px -18px rgba(10,63,47,.45); display:flex; align-items:center; justify-content:center; padding:24px 20px 38px; }
  .banner{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hero-plate{ position:relative; z-index:1; text-align:center; padding:12px 28px; border-radius:8px; background:rgba(10,63,47,.82); border:1.5px solid #E3B04B; box-shadow:0 10px 26px -10px rgba(0,0,0,.55); max-width:100%; }
  .hero-name{ margin:0; font-weight:700; font-size:clamp(30px,8vw,52px); line-height:1.2; color:#FBF7EC; text-shadow:0 2px 6px rgba(0,0,0,.4); }

  /* ---------- Card ---------- */
  .card{
    position:relative; border-radius:var(--radius); border:1px solid var(--line);
    background:radial-gradient(120% 140% at 90% -10%, rgba(227,154,22,.2), transparent 55%), linear-gradient(155deg,#fff,var(--cream-2));
    box-shadow:0 28px 56px -24px rgba(10,63,47,.35);
    padding:clamp(18px,4vw,36px); display:flex; flex-direction:column; gap:18px; overflow:hidden;
  }
  .card::before{ content:""; position:absolute; inset:9px; border:1px solid var(--line); border-radius:3px; pointer-events:none; }
  .card-top{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  .card-top-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; width:100%; }

  .lang-toggle{ display:flex; flex-shrink:0; border:1.5px solid var(--green); border-radius:999px; padding:3px; gap:3px; background:rgba(14,90,67,.06); }
  .lang-btn{
    border:0; background:transparent; color:var(--green-deep); font:600 14px 'Inter','Tajawal','Noto Sans Devanagari',sans-serif;
    padding:6px 15px; min-height:34px; border-radius:999px; cursor:pointer; touch-action:manipulation; transition:background .2s,color .2s;
  }
  .lang-btn.active{ background:var(--green); color:#fff; }
  .lang-btn:focus-visible,.speak-btn:focus-visible,.chip:focus-visible,.mic-fab:focus-visible,.enquiry-toggle:focus-visible,.submit-enquiry-btn:focus-visible{ outline:2px solid var(--saffron); outline-offset:2px; }

  .speak-btn{
    display:flex; align-items:center; gap:10px; background:transparent; border:1px solid var(--green); color:var(--green-deep);
    border-radius:999px; padding:8px 16px; min-height:40px; font:500 13px 'Inter','Tajawal','Noto Sans Devanagari',sans-serif; cursor:pointer; touch-action:manipulation;
  }
  .speak-btn.playing{ background:rgba(14,90,67,.1); }
  .wave{ display:flex; align-items:center; gap:2px; height:14px; }
  .wave i{ width:2px; height:4px; background:var(--green); border-radius:1px; }
  .speak-btn.playing .wave i{ animation:bounce .9s ease-in-out infinite; }
  .wave i:nth-child(2){ animation-delay:.12s } .wave i:nth-child(3){ animation-delay:.24s } .wave i:nth-child(4){ animation-delay:.36s }
  @keyframes bounce{ 0%,100%{height:4px} 50%{height:13px} }

  .mic-fab{
    width:60px; height:60px; border-radius:50%; border:0; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; touch-action:manipulation; box-shadow:0 10px 22px -8px rgba(10,63,47,.6), 0 0 0 6px rgba(14,90,67,.14); transition:transform .2s;
  }
  .mic-fab:hover{ transform:scale(1.05); }
  .mic-fab.listening{ background:#fff; color:var(--green); box-shadow:0 0 0 3px var(--green); animation:pulse 1.4s ease-in-out infinite; }
  .mic-fab:disabled{ opacity:.35; cursor:not-allowed; box-shadow:none; animation:none; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 3px var(--green),0 0 0 3px rgba(14,90,67,.45) } 50%{ box-shadow:0 0 0 3px var(--green),0 0 0 16px rgba(14,90,67,0) } }

  .card-mid{ display:flex; flex-direction:column; gap:6px; }
  .role-tag{ font-size:12px; color:var(--gold); font-weight:600; letter-spacing:.04em; }
  .company-name{ margin:0; font-weight:700; font-size:clamp(30px,6vw,44px); line-height:1.2; color:var(--green-deep); }
  .tagline{ margin:0; font-size:14.5px; color:var(--gold); max-width:380px; }
  .card-bottom{ border-top:1px solid var(--line); padding-top:12px; }
  .contact-line{ font-size:12.5px; display:flex; flex-direction:column; gap:2px; opacity:.85; }
  .contact-line b{ color:var(--green); font-weight:600; }
  .contact-line bdi{ unicode-bidi:isolate; }

  /* ---------- Console ---------- */
  .console{ border:1px solid var(--line); border-radius:var(--radius); background:#fff; padding:22px clamp(16px,4vw,28px); }
  .console-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px; }
  .console-head h2{ font-weight:700; font-size:17px; margin:0; }
  .status-dot{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--gold); }
  .status-dot::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--gold); }
  .status-dot.live{ color:var(--green); }
  .status-dot.live::before{ background:#2FA57A; box-shadow:0 0 0 3px rgba(47,165,122,.25); }

  .transcript{ min-height:70px; max-height:230px; overflow-y:auto; font-size:14.5px; display:flex; flex-direction:column; gap:10px; }
  .transcript .empty{ color:var(--gold); font-size:13.5px; margin:0; }
  .bubble{ max-width:88%; padding:9px 13px; border-radius:var(--radius); font-size:14px; }
  .bubble.user{ align-self:flex-end; background:rgba(227,154,22,.16); border:1px solid rgba(227,154,22,.45); }
  .bubble.agent{ align-self:flex-start; background:rgba(14,90,67,.06); border:1px solid var(--line); }

  .console-controls{ display:flex; flex-direction:column; gap:8px; margin-top:16px; }
  .chip{
    display:flex; align-items:center; gap:10px; width:100%; min-height:46px; padding:8px 16px; border-radius:999px;
    background:var(--green); border:1px solid var(--green); color:#fff; font:600 14px 'Inter','Tajawal','Noto Sans Devanagari',sans-serif;
    cursor:pointer; text-decoration:none; touch-action:manipulation; transition:background .2s;
  }
  .chip:hover{ background:var(--green-deep); }
  .chip-icon{
    display:flex; align-items:center; justify-content:center; width:32px; height:32px; flex-shrink:0; border-radius:50%;
    background:radial-gradient(circle at 32% 28%,#F5C45E,#B8860B 72%); color:var(--green-deep); box-shadow:0 3px 6px rgba(0,0,0,.3), inset 0 1px 1px rgba(255,255,255,.5);
  }
  .chip-label{ flex:1; text-align:center; }

  .ask-row{ display:flex; gap:8px; margin-top:14px; }
  .ask-row input{ flex:1 1 0; min-width:0; background:var(--cream); border:1px solid var(--line); color:var(--green-deep); padding:10px 12px; border-radius:var(--radius); font:16px 'Inter','Tajawal','Noto Sans Devanagari',sans-serif; }
  .send-btn{ border:1px solid var(--green); background:transparent; color:var(--green); width:46px; min-height:46px; border-radius:var(--radius); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  [dir=rtl] .send-btn svg{ transform:scaleX(-1); }
  input:focus,textarea:focus{ outline:none; border-color:var(--green) !important; }
  .note{ margin:12px 0 0; font-size:12px; color:rgba(10,63,47,.65); }

  .enquiry-block{ margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .enquiry-toggle{ display:flex; align-items:center; gap:7px; background:transparent; border:0; color:var(--green); font:600 13.5px 'Inter','Tajawal','Noto Sans Devanagari',sans-serif; padding:8px 0; min-height:38px; cursor:pointer; }
  .enquiry-form{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .enquiry-form[hidden]{ display:none; }
  .enquiry-form input,.enquiry-form textarea{ width:100%; background:var(--cream); border:1px solid var(--line); color:var(--green-deep); padding:10px 12px; border-radius:var(--radius); font:16px 'Inter','Tajawal','Noto Sans Devanagari',sans-serif; resize:vertical; }
  .enquiry-form-actions{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .submit-enquiry-btn{ background:var(--green); border:0; color:#fff; font:600 14px 'Inter','Tajawal','Noto Sans Devanagari',sans-serif; padding:10px 20px; min-height:42px; border-radius:999px; cursor:pointer; }
  .submit-enquiry-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .enquiry-status{ font-size:12.5px; color:var(--gold); }
  .enquiry-status.success{ color:#1F7A4D; } .enquiry-status.error{ color:#B5432E; }

  @media (max-width:380px){ .lang-btn{ padding:6px 10px; font-size:13px; } }
  @media (prefers-reduced-motion:reduce){ .wave i,.mic-fab{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="stage">

  <header class="hero">

      <pattern id="p" width="50" height="50" patternUnits="userSpaceOnUse">

  <div class="card" id="card">

          <button type="button" class="lang-btn active" data-lang="ar">العربية</button>

      </button>
    </div>

    <div class="card-mid">

    <div class="card-bottom"><div class="contact-line" id="contactLine"></div></div>

  <div class="console">
    <div class="console-head">
      <h2 id="consoleTitle"></h2>
      <div class="status-dot" id="statusDot"></div>
    </div>
    <div class="transcript" id="transcript"></div>

    <div class="ask-row">
      <input type="text" id="askInput" autocomplete="off">
      <button class="send-btn" id="sendBtn" aria-label="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>

    <div class="console-controls" id="chips"></div>
    <p class="note" id="voiceNote"></p>

    <div class="enquiry-block">
      <button type="button" class="enquiry-toggle" id="enquiryToggleBtn" aria-expanded="false">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span id="enquiryToggleLabel"></span>
      </button>
      <div class="enquiry-form" id="enquiryForm" hidden>
        <input type="text" id="enquiryName" autocomplete="name">
        <input type="text" id="enquiryContact" autocomplete="email">
        <textarea id="enquiryText" rows="3"></textarea>
        <div class="enquiry-form-actions">

          <span class="enquiry-status" id="enquiryStatus" role="status" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </div>
</div>

/* ---------- Render everything from COMPANY[currentLang] ---------- */
function render(){
  const t = COMPANY[currentLang];
  const h = document.documentElement;
  h.lang = t.speechLang; h.dir = t.dir;
  $('companyName').textContent = t.name;
  $('roleTag').textContent = t.role;
  $('tagline').textContent = t.tagline;
  const siteUrl = /^https?:\/\//i.test(COMPANY.website) ? COMPANY.website : `https://${COMPANY.website}`;
  const siteText = COMPANY.website.replace(/^https?:\/\//i, '').replace(/\/$/, '');
  $('contactLine').innerHTML = `<span><b><a href="${siteUrl}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none"><bdi dir="ltr">${siteText}</bdi></a></b></span><span><bdi>${COMPANY.email}</bdi> · <bdi dir="ltr">${COMPANY.phone}</bdi></span>`;
  document.title = t.name;
  speakLabel.textContent = t.speakLabel;
  $('consoleTitle').textContent = t.consoleTitle;
  askInput.placeholder = t.inputPlaceholder;
  voiceNote.textContent = SpeechRecognition ? t.voiceNote : t.voiceNoteUnsupported;
  statusDot.textContent = t.status.idle;
  transcript.innerHTML = `<p class="empty">${t.emptyTranscript}</p>`;

  chipsWrap.innerHTML = '';
  t.topics.forEach((topic, i) => {
    const chip = document.createElement('button');
    chip.className = 'chip'; chip.type = 'button';
    chip.innerHTML = `<span class="chip-icon">${TOPIC_ICONS[i] || ''}</span><span class="chip-label">${topic.label}</span>`;
    chip.addEventListener('click', () => askQuestion(topic.label, topic));
    chipsWrap.appendChild(chip);
  });
  const web = document.createElement('a');
  web.className = 'chip'; web.target = '_blank'; web.rel = 'noopener noreferrer';
  web.href = /^https?:\/\//i.test(COMPANY.website) ? COMPANY.website : `https://${COMPANY.website}`;
  web.innerHTML = `<span class="chip-icon">${WEB_ICON}</span><span class="chip-label">${t.viewWebsiteLabel}</span>`;
  chipsWrap.appendChild(web);

  if (recognition) recognition.lang = t.speechLang;
  const e = t.enquiry;

$('langToggle').addEventListener('click', ev => {
  const btn = ev.target.closest('.lang-btn');
  if (!btn || btn.classList.contains('active')) return;
  currentLang = btn.dataset.lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b === btn));
  if (synth) synth.cancel();
  render();
  playIntro();
});

/* ---------- Speech synthesis ---------- */
const synth = window.speechSynthesis;
if (synth){
  synth.getVoices();
  try { const p = new SpeechSynthesisUtterance(' '); p.volume = 0; p.rate = 16; synth.speak(p); } catch (_) {}
}
const FEMALE_VOICE_PATTERN = /female|woman|girl|samantha|zira|jenny|aria|susan|victoria|karen|moira|tessa|fiona|veena|raveena|lekha|swara|heera|kalpana|priya|neerja|salli|joanna|kendra|kimberly|ivy|amy|emma|nicole|olivia|zariyah|laila|salma|hoda|noura|amira|mariam|zeina|shelley|google/i;

function normLang(l){ return (l || '').replace('_','-').toLowerCase(); }
function pickVoice(lang){
  const voices = synth.getVoices();
  if (!voices.length) return null;
  const want = normLang(lang), prefix = want.split('-')[0];
  const exact = voices.filter(v => normLang(v.lang) === want);
  const same = voices.filter(v => normLang(v.lang).split('-')[0] === prefix);
  return exact.find(v => FEMALE_VOICE_PATTERN.test(v.name)) || same.find(v => FEMALE_VOICE_PATTERN.test(v.name)) || exact[0] || same[0] || null;
}

// Voices load asynchronously (especially Arabic/Hindi) — wait briefly for them before the first line.
function voicesReady(){
  return new Promise(res => {
    if (!synth || synth.getVoices().length) return res();
    const done = () => { synth.removeEventListener('voiceschanged', done); res(); };
    synth.addEventListener('voiceschanged', done);
    setTimeout(done, 1500);
  });
}

let hasSpokenOnce = false;
async function speak(text){
  const t = COMPANY[currentLang];
  if (!synth) return;
  await voicesReady();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = t.speechLang;
  const voice = pickVoice(t.speechLang);
  if (voice) u.voice = voice;
  else if (synth.getVoices().length) voiceNote.textContent = t.noVoice;
  u.rate = 1;
  u.pitch = voice && FEMALE_VOICE_PATTERN.test(voice.name) ? 1 : 1.15;
  u.onstart = () => {
    hasSpokenOnce = true;
    speakBtn.classList.add('playing'); speakBtn.setAttribute('aria-pressed', 'true');
    statusDot.textContent = COMPANY[currentLang].status.speaking; statusDot.classList.add('live');
  };
  u.onend = u.onerror = () => {
    speakBtn.classList.remove('playing'); speakBtn.setAttribute('aria-pressed', 'false');
    statusDot.textContent = COMPANY[currentLang].status.idle; statusDot.classList.remove('live');
  };
  if (synth.speaking || synth.pending){
    synth.cancel();
    setTimeout(() => { synth.resume(); synth.speak(u); }, 60);
  } else { synth.resume(); synth.speak(u); }
}

speakBtn.addEventListener('click', () => {
  if (synth && synth.speaking){ synth.cancel(); return; }
  playIntro();
});

/* ---------- Transcript & Q&A ---------- */
function addBubble(who, text){
  const empty = transcript.querySelector('.empty');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'bubble ' + who; d.textContent = text;
  transcript.appendChild(d);
  transcript.scrollTop = transcript.scrollHeight;
}

function findAnswer(question){
  const t = COMPANY[currentLang];
  const q = question.toLowerCase();
  const hit = t.topics.find(tp => tp.keywords.some(k => q.includes(k.toLowerCase())));
  return hit ? hit.answer : t.fallback;
}

// Topic chips pass their topic directly, so the answer never depends on keyword matching.
function askQuestion(question, topic){
  if (!question || !question.trim()) return;
  if (synth && (synth.speaking || synth.pending)) synth.cancel();
  addBubble('user', question);
  const answer = topic ? topic.answer : findAnswer(question);
  statusDot.textContent = COMPANY[currentLang].status.thinking;
  setTimeout(() => { addBubble('agent', answer); speak(answer); }, 120);
}

function submitInput(){ const v = askInput.value; askInput.value = ''; askQuestion(v); }
$('sendBtn').addEventListener('click', submitInput);
askInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitInput(); });

/* ---------- Voice input ---------- */
const micBtn = $('micBtn');
let listening = false;
if (SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.interimResults = false; recognition.maxAlternatives = 1;
  recognition.onstart = () => {
    listening = true; micBtn.classList.add('listening');
    statusDot.textContent = COMPANY[currentLang].status.listening; statusDot.classList.add('live');
  };
  recognition.onend = recognition.onerror = () => {
    listening = false; micBtn.classList.remove('listening'); statusDot.classList.remove('live');
    statusDot.textContent = COMPANY[currentLang].status.idle;
  };
  recognition.onresult = ev => askQuestion(ev.results[0][0].transcript);
  micBtn.addEventListener('click', () => {
    if (listening){ recognition.stop(); return; }
    if (synth) synth.cancel();
    recognition.lang = COMPANY[currentLang].speechLang;
    recognition.start();
  });
} else { micBtn.disabled = true; }

/* ---------- Enquiries → Supabase ---------- */
const enquiryForm = $('enquiryForm'), enquiryStatus = $('enquiryStatus'), submitBtn = $('submitEnquiryBtn');
$('enquiryToggleBtn').addEventListener('click', () => {
  enquiryForm.hidden = !enquiryForm.hidden;
  $('enquiryToggleBtn').setAttribute('aria-expanded', String(!enquiryForm.hidden));
  if (!enquiryForm.hidden) $('enquiryText').focus();
});
submitBtn.addEventListener('click', submitEnquiry);
$('enquiryText').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) submitEnquiry(); });

async function submitEnquiry(){
  const t = COMPANY[currentLang];
  const text = $('enquiryText').value.trim();
  const setStatus = (msg, cls) => { enquiryStatus.textContent = msg; enquiryStatus.className = 'enquiry-status' + (cls ? ' ' + cls : ''); };
  if (!text){ setStatus(t.enquiry.requiredError, 'error'); $('enquiryText').focus(); return; }
  if (!CONFIG.supabaseUrl || CONFIG.supabaseUrl.includes('PASTE_YOUR') || !CONFIG.supabaseAnonKey || CONFIG.supabaseAnonKey.includes('PASTE_YOUR')){
    setStatus(t.enquiry.notConfigured, 'error'); return;
  }
  const payload = {
    name: $('enquiryName').value.trim(),
    contact: $('enquiryContact').value.trim(),
    enquiry: text,
    language: currentLang,
    company: COMPANY.en.name
  };
  submitBtn.disabled = true; setStatus(t.enquiry.submittingLabel);
  try {
    const res = await fetch(`${CONFIG.supabaseUrl.replace(/\/$/, '')}/rest/v1/${CONFIG.supabaseTable}`, {
      method: 'POST',
      headers: { apikey: CONFIG.supabaseAnonKey, Authorization: `Bearer ${CONFIG.supabaseAnonKey}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify(payload)
    });
    if (!res.ok){
      let d = ''; try { d = JSON.stringify(await res.json()); } catch (_) {}
      console.error(`Supabase insert failed (${res.status}):`, d);
      setStatus(t.enquiry.error, 'error'); return;
    }
    setStatus(t.enquiry.success, 'success');
    addBubble('agent', t.enquiry.voiceAck); speak(t.enquiry.voiceAck);
    $('enquiryName').value = $('enquiryContact').value = $('enquiryText').value = '';
  } catch (err){
    console.error('Enquiry request failed:', err);
    setStatus(t.enquiry.error, 'error');
  } finally { submitBtn.disabled = false; }
}

/* ---------- Start: render, then auto-play the intro ---------- */
render();
function playIntro(){
  const t = COMPANY[currentLang];
  addBubble('agent', t.intro);
  speak(t.intro);
}
playIntro();

// Mobile browsers may block speech without a gesture; retry once on the first tap/key.
['click','touchstart','keydown'].forEach(evt => {
  document.addEventListener(evt, () => { if (!hasSpokenOnce) speak(COMPANY[currentLang].intro); }, { once: true });
});
</script>
